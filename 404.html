<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 — Emper Shop</title>
  <link rel="icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#08080b;color:#f5f5f7;font-family:'Kanit',sans-serif;overflow:hidden}.glow{position:fixed;width:560px;height:560px;border-radius:50%;background:#7c3aed2b;filter:blur(120px);pointer-events:none}.card{position:relative;z-index:1;width:min(680px,100%);padding:48px 34px;text-align:center;border:1px solid #ffffff17;border-radius:30px;background:linear-gradient(145deg,#ffffff0b,#ffffff04);box-shadow:0 35px 90px #0009;backdrop-filter:blur(18px)}.logo{width:82px;height:82px;margin:0 auto 22px;border-radius:24px;background:#09090d url('assets/brand/emper-logo.webp') center/cover no-repeat;border:1px solid #a855f755;box-shadow:0 0 35px #a855f73c}.code{font-family:'Archivo Black',sans-serif;font-size:clamp(68px,16vw,138px);line-height:.9;letter-spacing:-5px;background:linear-gradient(180deg,#fff,#9d8bb8);-webkit-background-clip:text;color:transparent}h1{margin:18px 0 8px;font-size:28px}p{max-width:480px;margin:0 auto;color:#9ca3af;line-height:1.75;font-size:14px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:28px}.actions a{padding:12px 19px;border-radius:999px;text-decoration:none;font-weight:700;font-size:13px}.primary{background:#fff;color:#0a0a0d}.secondary{border:1px solid #ffffff17;color:#fff;background:#ffffff0a}@media(max-width:520px){.card{padding:38px 20px}.actions a{width:100%}}
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main class="card">
    <div class="logo" aria-hidden="true"></div>
    <div class="code">404</div>
    <h1>หาหน้านี้ไม่เจอ</h1>
    <p>ลิงก์อาจถูกย้ายหรือพิมพ์ผิด กลับไปหน้าร้านแล้วเลือกสินค้าใหม่ได้เลย</p>
    <div class="actions"><a class="primary" href="index.html">กลับหน้าร้าน</a><a class="secondary" href="index.html#products">ดูสินค้า</a></div>
  </main>
</body>
</html>
